<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block-Marshak Matching</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Georgia', serif;
      background: #f0ede8;
      height: 100vh; overflow: hidden; color: #222;
      display: flex; flex-direction: row;
    }
    button {
      padding: 0.45rem 1.1rem; border: none; border-radius: 7px;
      cursor: pointer; font-size: 0.88rem; font-family: inherit;
      transition: background 0.15s, transform 0.08s;
    }
    button:active { transform: scale(0.96); }
    .btn-primary { background: #4a7bbd; color: white; }
    .btn-primary:hover { background: #3869aa; }
    .btn-ghost { background: #ebebeb; color: #444; }
    .btn-ghost:hover { background: #ddd; }
    .btn-danger {
      background: none; border: 1.5px solid #c0392b; color: #c0392b;
      border-radius: 50%; width: 22px; height: 22px; padding: 0;
      font-size: 0.9rem; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
    }
    .btn-danger:hover { background: #c0392b; color: white; }

    /* ── Diagram area ── */
    #diagram-area {
      flex: 1; min-width: 0; overflow: auto;
      display: flex; flex-direction: column;
      padding: 0.8rem 1.2rem; gap: 0.5rem;
    }
    .diagram-topbar {
      display: flex; align-items: center; gap: 0.9rem;
      flex-shrink: 0; flex-wrap: wrap;
    }
    .n-selector-wrap {
      display: flex; align-items: center; gap: 0.35rem;
      font-size: 0.88rem; color: #555;
    }
    .n-selector-wrap select {
      font-size: 0.88rem; font-family: 'Georgia', serif;
      border: 1.5px solid #ccc; border-radius: 6px;
      padding: 0.22rem 0.45rem; background: white; cursor: pointer;
    }
    .n-selector-wrap select:focus { outline: none; border-color: #4a7bbd; }
    #diagram-title { font-size: 1rem; color: #555; font-weight: normal; }

    /* ── Right bar (Set Target / target badge) ── */
    #right-bar { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
    .btn-set-target {
      background: #4a7bbd; color: white;
      padding: 0.32rem 1rem; font-size: 0.85rem; border-radius: 7px;
      border: none; cursor: pointer; transition: background 0.15s;
    }
    .btn-set-target:hover { background: #3869aa; }
    .target-set-badge {
      font-size: 0.8rem; color: #2a7a3a; font-weight: bold;
      background: #e8f8ed; border: 1.5px solid #2a7a3a;
      border-radius: 6px; padding: 0.2rem 0.55rem;
    }

    /* ── Inline target input (lives inside #right-bar when editing) ── */
    .target-inline-input {
      font-size: 0.79rem; font-family: monospace;
      padding: 0.22rem 0.5rem; border: 1.5px solid #ccc; border-radius: 6px;
      background: white; width: 300px;
    }
    .target-inline-input:focus { outline: none; border-color: #4a7bbd; }
    .target-inline-input.parse-ok  { border-color: #2a7a3a; background: #f0fff0; }
    .target-inline-input.parse-err { border-color: #c0392b; background: #fff5f5; }
    #target-paste-status { font-size: 0.72rem; }

    /* ── Expression bar (target choice expression, shown when target locked) ── */
    #expr-bar {
      display: none; flex-shrink: 0;
      background: #f0f5ff; border: 1.5px solid #c0d0e8;
      border-radius: 8px; padding: 0.38rem 0.75rem;
      align-items: flex-start; gap: 0.5rem;
    }
    #expr-bar.visible { display: flex; }
    #expr-bar-label { font-size: 0.74rem; color: #557; white-space: nowrap; flex-shrink: 0; padding-top: 0.22rem; }
    #expr-bar-text {
      flex: 1; min-width: 0; height: 42px; resize: none;
      padding: 0.2rem 0.5rem; font-size: 0.79rem; font-family: monospace;
      border: 1.5px solid #c0d0e8; border-radius: 6px;
      background: #fafbff; color: #333; line-height: 1.4;
    }
    #expr-bar-btns { display: flex; flex-direction: column; gap: 0.25rem; flex-shrink: 0; }

    /* ── Display mode bar (bottom-left) ── */
    #disp-mode-bar {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.8rem; color: #666; flex-shrink: 0;
      margin-top: auto; align-self: flex-start;
    }
    #disp-mode-bar span { color: #999; }
    .disp-btn {
      font-size: 0.75rem; padding: 0.15rem 0.55rem;
      border: 1.5px solid #ccc; border-radius: 5px;
      background: white; color: #666; cursor: pointer; transition: all 0.12s;
    }
    .disp-btn.active { border-color: #4a7bbd; background: #4a7bbd; color: white; }
    .disp-btn:hover:not(.active) { border-color: #999; background: #f0f0f0; }

    /* ── Hasse ── */
    #hasse {
      display: flex; flex-direction: column; gap: 1.2rem;
      align-items: center; flex: 1; justify-content: center; min-height: 0;
    }
    .hasse-layer { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }

    /* ── Constant box ── */
    .constant-row { display: flex; justify-content: center; }
    .constant-box {
      display: flex; flex-direction: column; align-items: center;
      border: 2px solid #c8c2b8; border-radius: 9px; background: #f5f5f0;
      padding: 3px 14px 4px; gap: 1px; min-width: 72px;
    }
    .constant-current { font-size: 1rem; font-weight: bold; color: #333; min-height: 1.1em; line-height: 1; }
    .constant-label.unmatched { color: #c0392b; font-weight: bold; }
    .constant-label { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
    .constant-target { font-size: 0.85rem; color: #888; font-style: italic; min-height: 1em; line-height: 1; }
    .constant-k-input {
      width: 46px; height: 20px; font-size: 0.78rem; text-align: center;
      border: 1px solid #bbb; border-radius: 3px; padding: 0 3px;
      font-family: monospace;
    }
    .constant-k-input:focus { outline: none; border-color: #4a7bbd; }

    /* ── Expanded panels ── */
    .expanded-panel {
      border-top: 2px solid #e4e0d8; background: white;
      border-radius: 8px 8px 0 0; padding: 0.7rem 1rem 0.8rem; flex-shrink: 0;
    }
    .expanded-panel-header {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 0.55rem; flex-wrap: wrap;
    }
    .expanded-panel-header strong { font-size: 0.85rem; color: #555; }
    .mode-options { display: flex; gap: 0.8rem; font-size: 0.8rem; color: #555; }
    .mode-options label { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
    .expanded-textarea {
      width: 100%; height: 78px; font-family: monospace; font-size: 0.73rem;
      border: 1.5px solid #ddd; border-radius: 7px;
      padding: 0.4rem 0.5rem; resize: vertical;
      background: #fafaf8; color: #333; display: block;
    }

    /* ── Subset box ── */
    .subset-box {
      display: inline-flex; flex-direction: column; align-items: center;
      border: 2px solid #c8c2b8; border-radius: 9px; background: white;
      padding: 3px 5px 4px;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .subset-box.is-source { border-color: #4a7bbd; background: #f0f5ff; box-shadow: 0 0 0 3px rgba(74,123,189,0.18); }
    .subset-box.is-target { border-color: #d07000; background: #fff9f0; box-shadow: 0 0 10px rgba(208,112,0,0.25); cursor: pointer; }
    .subset-box.is-target:hover { background: #fff2d8; box-shadow: 0 0 14px rgba(208,112,0,0.40); }
    .letter-cols { display: flex; }
    .letter-col  { display: flex; flex-direction: column; align-items: center; }
    .coeff-cell {
      font-size: 1rem; font-weight: bold; text-align: center; line-height: 1;
      user-select: none; pointer-events: none;
      min-width: 0.6rem; padding: 0 1px; min-height: 1.1em;
    }
    .coeff-pos  { color: #2178b4; }
    .coeff-neg  { color: #8b1a1a; }
    .coeff-zero { color: #111; }
    .coeff-cell.coeff-preview           { opacity: 0.42; }
    .coeff-cell.coeff-preview.coeff-pos { color: #2178b4; }
    .coeff-cell.coeff-preview.coeff-neg { color: #8b1a1a; }
    .coeff-cell.coeff-preview.coeff-zero{ color: #555; }
    .letter-cell {
      text-align: center; font-size: 1rem; padding: 1px 1px;
      border-radius: 4px; cursor: pointer; user-select: none;
      line-height: 1.35; transition: color 0.1s; color: #222;
    }
    .letter-cell:hover     { color: #d07000; }
    .letter-cell.is-active { color: #d07000; }
    /* matched = normal black (no special styling); unmatched = red bold */
    .letter-cell.unmatched { color: #c0392b; font-weight: bold; }
    #hasse.selecting-mode .letter-cell:hover:not(.is-active) { color: #222; }

    /* ── Target cells ── */
    .target-cell {
      min-height: 1em; font-size: 0.78rem; text-align: center;
      color: #aaa; line-height: 1; padding: 0 1px;
      user-select: none; pointer-events: none;
    }
    .target-cell.has-target { color: #777; }
    .target-input-cell {
      width: 28px; height: 18px; font-size: 0.72rem; text-align: center;
      border: 1px solid #bbb; border-radius: 3px;
      padding: 0 2px; background: #f9f9f9; font-family: monospace;
      pointer-events: all;
    }
    .target-input-cell:focus { outline: none; border-color: #4a7bbd; background: white; }

    /* ── Bottom hint bar ── */
    #bottom-hint-bar {
      display: none; flex-shrink: 0; align-self: flex-end;
      background: #fff8ec; border: 1px solid #f0d090; border-radius: 8px;
      padding: 0.45rem 0.75rem; font-size: 0.82rem; color: #7a4800; line-height: 1.5;
    }
    #bottom-hint-bar.visible { display: block; }

    /* ── Congratulations ── */
    #congrats {
      display: none; text-align: center; padding: 0.55rem 1rem;
      font-size: 1rem; color: #2a7a3a; font-weight: bold;
      background: #f0fff0; border-radius: 8px;
      border: 2px solid #2a7a3a; flex-shrink: 0;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 280px; background: white;
      border-left: 2px solid #e4e0d8;
      display: flex; flex-direction: column;
      overflow: hidden; flex-shrink: 0;
    }
    #actions-panel {
      flex: 1; overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: 0.6rem; min-height: 0;
    }
    #actions-panel h3 {
      font-size: 0.95rem; color: #333;
      padding-bottom: 0.5rem; border-bottom: 1px solid #eee; flex-shrink: 0;
    }
    .selection-hint-box {
      background: #fff8ec; border: 1px solid #f0d090; border-radius: 8px;
      padding: 0.6rem 0.75rem; font-size: 0.82rem; color: #7a4800; line-height: 1.5;
    }
    .selection-hint-box strong { color: #c06000; }
    .action-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; border-bottom: 1px solid #f5f3f0; }
    .action-input {
      flex: 1; min-width: 0; border: 1.5px solid #ddd; border-radius: 5px;
      padding: 0.22rem 0.4rem; font-family: monospace; font-size: 0.78rem;
      color: #333; background: white; transition: border-color 0.15s;
    }
    .action-input:focus { outline: none; border-color: #4a7bbd; }
    .action-item.has-error .action-input { border-color: #c0392b; background: #fff5f5; }
    .action-error-icon { display: none; color: #c0392b; font-size: 0.9rem; flex-shrink: 0; }
    .action-item.has-error .action-error-icon { display: inline; }
    .new-action-row { padding: 0.4rem 0 0.1rem; }
    .new-action-input {
      width: 100%; border: 1.5px dashed #bbb; border-radius: 5px;
      padding: 0.28rem 0.4rem; font-family: monospace; font-size: 0.78rem;
      color: #999; background: #fafafa;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .new-action-input:focus { outline: none; border-color: #4a7bbd; border-style: solid; background: white; color: #333; }
    .no-actions-msg { color: #bbb; font-size: 0.85rem; font-style: italic; }
    .sidebar-panel {
      padding: 0.65rem 1rem; border-top: 2px solid #e4e0d8;
      display: flex; flex-direction: column; gap: 0.35rem; flex-shrink: 0;
    }
    .panel-header { display: flex; align-items: center; gap: 0.3rem; }
    .panel-header h4 { font-size: 0.85rem; color: #666; margin-right: auto; }
    .btn-expand {
      background: none; border: 1px solid #ddd; border-radius: 4px;
      padding: 0.08rem 0.3rem; font-size: 0.82rem; color: #999; line-height: 1; cursor: pointer;
    }
    .btn-expand:hover { background: #f0f0f0; color: #555; }
    .panel-textarea {
      width: 100%; height: 52px; font-family: monospace; font-size: 0.73rem;
      border: 1.5px solid #ddd; border-radius: 7px;
      padding: 0.38rem 0.5rem; resize: none;
      background: #fafaf8; color: #333; transition: border-color 0.15s;
    }
    .panel-textarea:focus { outline: none; border-color: #4a7bbd; }
    #save-code { background: white; }
    #save-code.parse-error { border-color: #c0392b; background: #fff5f5; }
    #save-code-status { font-size: 0.71rem; color: #c0392b; min-height: 1em; }
    .btn-copy-sm {
      background: #4a7bbd; color: white;
      padding: 0.18rem 0.55rem; font-size: 0.72rem; border-radius: 5px;
      border: none; cursor: pointer; transition: background 0.15s;
    }
    .btn-copy-sm:hover { background: #3869aa; }
    .btn-copy-sm.copied { background: #2a8a5a; }
    .btn-copy-sm.green { background: #6a8f5a; }
    .btn-copy-sm.green:hover { background: #4d7040; }
    /* mode badge in panel header */
    .mode-badge {
      font-size: 0.68rem; padding: 0.1rem 0.4rem;
      border: 1.5px solid #aaa; border-radius: 4px;
      background: white; color: #555; cursor: pointer;
      transition: all 0.12s; white-space: nowrap;
    }
    .mode-badge:hover { border-color: #4a7bbd; color: #4a7bbd; }
  </style>
</head>
<body>

<div id="diagram-area">
  <!-- Topbar -->
  <div class="diagram-topbar">
    <div class="n-selector-wrap">
      N:
      <select id="n-selector" onchange="handleNChange(this.value)">
        <option value="2">2</option><option value="3">3</option>
        <option value="4" selected>4</option><option value="5">5</option>
        <option value="6">6</option><option value="7">7</option>
        <option value="8">8</option><option value="9">9</option>
      </select>
    </div>
    <h2 id="diagram-title"></h2>
    <div id="right-bar"></div>
  </div>

  <!-- Target expression bar (shown after target is locked) -->
  <div id="expr-bar">
    <span id="expr-bar-label">Target:</span>
    <textarea id="expr-bar-text" readonly></textarea>
    <div id="expr-bar-btns">
      <button class="btn-copy-sm" id="btn-expr-copy" onclick="copyExprBar()">Copy</button>
      <button class="btn-copy-sm green" id="btn-expr-config" onclick="copyExprConfig()">Config</button>
    </div>
  </div>

  <div id="hasse"></div>
  <div id="congrats">Congratulations! All values matched!</div>

  <!-- Bottom hint bar: shows selection state without blocking the topbar Set Target button -->
  <div id="bottom-hint-bar"></div>

  <!-- Expanded Choice panel -->
  <div id="choice-expanded" class="expanded-panel" style="display:none">
    <div class="expanded-panel-header">
      <strong>Choice — expanded</strong>
      <div class="mode-options">
        <label><input type="radio" name="exp-disp" value="0" onchange="setDispMode(0)"> As Is</label>
        <label><input type="radio" name="exp-disp" value="1" checked onchange="setDispMode(1)"> All positive p</label>
        <label><input type="radio" name="exp-disp" value="2" onchange="setDispMode(2)"> Simplified p</label>
      </div>
      <button class="btn-ghost" style="font-size:0.78rem;padding:0.3rem 0.7rem;margin-left:auto;" onclick="toggleExpandChoice()">✕ Close</button>
    </div>
    <textarea id="choice-code-expanded" class="expanded-textarea" readonly></textarea>
  </div>

  <!-- Expanded BM panel -->
  <div id="bm-expanded" class="expanded-panel" style="display:none">
    <div class="expanded-panel-header">
      <strong>BM — expanded</strong>
      <div class="mode-options">
        <label><input type="radio" name="bm-sort" value="alpha" checked onchange="setBMSort(this.value)"> Alphabetical</label>
        <label><input type="radio" name="bm-sort" value="coeff" onchange="setBMSort(this.value)"> Coeff. Size (↓)</label>
      </div>
      <button class="btn-ghost" style="font-size:0.78rem;padding:0.3rem 0.7rem;margin-left:auto;" onclick="toggleExpandBM()">✕ Close</button>
    </div>
    <textarea id="latex-code-expanded" class="expanded-textarea" readonly></textarea>
  </div>

  <!-- Display mode bar – bottom-left corner -->
  <div id="disp-mode-bar">
    <span>Display:</span>
    <button class="disp-btn" id="dbtn-0" onclick="setDispMode(0)">As Is</button>
    <button class="disp-btn active" id="dbtn-1" onclick="setDispMode(1)">All positive p</button>
    <button class="disp-btn" id="dbtn-2" onclick="setDispMode(2)">Simplified p</button>
  </div>
</div>

<div id="sidebar">
  <div id="actions-panel">
    <h3>Actions</h3>
    <div id="selection-hint" style="display:none" class="selection-hint-box"></div>
    <div id="actions-list"><p class="no-actions-msg">No actions yet.</p></div>
  </div>

  <!-- Choice panel -->
  <div class="sidebar-panel" id="choice-panel">
    <div class="panel-header">
      <h4>Choice</h4>
      <button class="mode-badge" id="choice-mode-badge" onclick="cycleDispMode()" title="Click to cycle display mode"></button>
      <button class="btn-copy-sm" id="btn-copy-choice" onclick="copyPanel('choice-code','btn-copy-choice','Copy','✓')">Copy</button>
      <button class="btn-copy-sm green" id="btn-copy-config" onclick="copyChoiceConfig()">Config</button>
      <button class="btn-expand" id="btn-expand-choice" onclick="toggleExpandChoice()">⤢</button>
    </div>
    <textarea id="choice-code" class="panel-textarea" readonly></textarea>
  </div>

  <!-- BM panel -->
  <div class="sidebar-panel" id="latex-panel">
    <div class="panel-header">
      <h4>BM</h4>
      <button class="mode-badge" id="bm-sort-badge" onclick="cycleBMSort()" title="Click to toggle sort order">Alpha ▸</button>
      <button class="btn-copy-sm" id="btn-copy-latex" onclick="copyPanel('latex-code','btn-copy-latex','Copy','✓')">Copy</button>
      <button class="btn-expand" id="btn-expand-bm" onclick="toggleExpandBM()">⤢</button>
    </div>
    <textarea id="latex-code" class="panel-textarea" readonly></textarea>
  </div>

  <!-- Save Code -->
  <div class="sidebar-panel" id="code-panel">
    <div class="panel-header">
      <h4>Save Code</h4>
      <button class="btn-copy-sm" id="btn-copy-code" onclick="copyPanel('save-code','btn-copy-code','Copy','✓')">Copy</button>
    </div>
    <textarea id="save-code" class="panel-textarea" placeholder="Paste a save code here to load it…"></textarea>
    <div id="save-code-status"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
let N=0, alts=[], coeffs={}, touched={}, actions=[];
let selLetter=null, selSource=null;
let _updatingCode=false, _bmExpanded=false, _choiceExpanded=false;

// dispMode: 0=As Is, 1=All positive p, 2=Simplified p
let dispMode = 1;

// bmSortMode: 'alpha' or 'coeff'
let bmSortMode = 'alpha';

// Target state
let targetCoeffs={}, targetK=0, targetActive=false, targetEditMode=false;

// ═══════════════════════════════════════════════════════════
//  CORE HELPERS
// ═══════════════════════════════════════════════════════════
function popcount(n){let c=0;while(n){c+=n&1;n>>>=1;}return c;}
function maskLetterIndices(mask){
  const out=[];for(let i=0;i<N;i++)if(mask&(1<<i))out.push(i);return out;
}
// Like maskLetterIndices but sorted by bmSortMode for box display
function sortedLetterIndicesForBox(mask){
  const letters=maskLetterIndices(mask);
  if(bmSortMode==='coeff'){
    // Sort by dispCoeff descending (largest positive first), then alphabetical
    letters.sort((a,b)=>dispCoeff(mask,b)-dispCoeff(mask,a)||a-b);
  }
  return letters;
}
function maskToStr(mask){return maskLetterIndices(mask).map(i=>alts[i]).join('');}
function layeredMasks(){
  const layers=[];
  for(let size=N;size>=1;size--){
    const row=[];
    for(let m=1;m<(1<<N);m++)if(popcount(m)===size)row.push(m);
    row.sort((a,b)=>{
      const ia=maskLetterIndices(a),ib=maskLetterIndices(b);
      for(let i=0;i<ia.length;i++)if(ia[i]!==ib[i])return ia[i]-ib[i];
      return 0;
    });
    layers.push(row);
  }
  return layers;
}
function getCoeff(mask,li){return(coeffs[mask]&&coeffs[mask][li]!==undefined)?coeffs[mask][li]:0;}
function isTouched(mask,li){return!!(touched[mask]&&touched[mask].has(li));}
function isValidTarget(mask){
  if(selLetter===null||selSource===null)return false;
  return(mask&selSource)===selSource;
}

// ═══════════════════════════════════════════════════════════
//  TARGET HELPERS
// ═══════════════════════════════════════════════════════════
function getTargetCoeff(mask,li){
  return(targetCoeffs[mask]&&targetCoeffs[mask][li]!==undefined)?targetCoeffs[mask][li]:0;
}
function setTargetCoeff(mask,li,val){
  if(!targetCoeffs[mask])targetCoeffs[mask]={};
  targetCoeffs[mask][li]=val;
}

// factorForSet: how much to subtract from each letter in set for the given mode
function factorForSet(mask,src,mode){
  const letters=maskLetterIndices(mask);
  if(!letters.length)return 0;
  const get=li=>src==='target'?getTargetCoeff(mask,li):getCoeff(mask,li);
  const vals=letters.map(get);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  if(mode===0)return 0;                // As Is: no factoring
  if(mode===1)return mn;               // All positive p: subtract min (makes all ≥ 0)
  // mode 2 Simplified p: only factor if all same sign
  if(mn>0)return mn;                   // all positive: subtract min → min becomes 0
  if(mx<0)return mx;                   // all negative: subtract max → max becomes 0
  return 0;                            // mixed signs: no factoring
}

function dispCoeff(mask,li){return getCoeff(mask,li)-factorForSet(mask,'current',dispMode);}
function dispTargetCoeff(mask,li){return getTargetCoeff(mask,li)-factorForSet(mask,'target',dispMode);}

function currentConstant(){
  let t=0;for(let m=1;m<(1<<N);m++)t+=factorForSet(m,'current',dispMode);return t;
}
function targetConstant(){
  let t=0;for(let m=1;m<(1<<N);m++)t+=factorForSet(m,'target',dispMode);return t+targetK;
}

function isMatched(mask,li){
  return targetActive&&dispCoeff(mask,li)===dispTargetCoeff(mask,li);
}
function checkAllMatched(){
  if(!targetActive)return false;
  for(let m=1;m<(1<<N);m++)
    for(const li of maskLetterIndices(m))
      if(dispCoeff(m,li)!==dispTargetCoeff(m,li))return false;
  return currentConstant()===targetConstant();
}
function updateCongrats(){
  document.getElementById('congrats').style.display=checkAllMatched()?'':'none';
}

// ═══════════════════════════════════════════════════════════
//  PARSE INPUT → TARGET
//  Accepts: matlabsolver config code  OR  Choice LaTeX formula
// ═══════════════════════════════════════════════════════════
function parseInputAsTarget(raw){
  raw=raw.trim();
  if(!raw)return null;
  if(/^\d+\|/.test(raw))return parseConfigCode(raw);
  if(/p\s*\(/.test(raw))return parseChoiceLatex(raw);
  return null;
}

function parseConfigCode(raw){
  const parts=raw.split('|');
  if(parts.length<5)return null;
  const n=parseInt(parts[0]);
  if(isNaN(n)||n<2||n>9)return null;
  const k=parseInt(parts[4]);
  if(isNaN(k))return null;
  const newTarget={};
  for(let i=5;i<parts.length;i++){
    const p=parts[i].trim();if(!p)continue;
    const m=p.match(/^(\d+):(\d+):(-?\d+)$/);
    if(!m)return null;
    const mask=+m[1],li=+m[2],val=+m[3];
    if(mask<1||mask>=(1<<n)||li<0||li>=n)return null;
    if(!(mask&(1<<li)))return null;
    if(!newTarget[mask])newTarget[mask]={};
    newTarget[mask][li]=val;
  }
  // k is a separate constant term; do NOT fold it into the stored coefficients
  return{n,targetCoeffs:newTarget,targetK:k};
}

function parseChoiceLatex(text){
  let s=text.replace(/\\,/g,',').replace(/\\/g,'').replace(/\s+/g,' ').trim();
  const newTarget={};
  let constant=0;
  const consumed=[];
  const re=/([+\-]?\s*\d*)\s*p\s*\(\s*([a-z])\s*,\s*([a-zA-Z]+)\s*\)/gi;
  let m;
  while((m=re.exec(s))!==null){
    let cs=m[1].replace(/\s/g,'');
    const xChar=m[2].toLowerCase();
    const sStr=m[3].toLowerCase();
    let coeff=cs===''||cs==='+'?1:cs==='-'?-1:parseInt(cs);
    if(isNaN(coeff))return null;
    const x=alts.indexOf(xChar);
    if(x<0)return null;
    let mask=0;
    for(const ch of sStr){
      const idx=alts.indexOf(ch);
      if(idx<0)return null;
      mask|=(1<<idx);
    }
    if(!(mask&(1<<x)))return null;
    if(!newTarget[mask])newTarget[mask]={};
    newTarget[mask][x]=(newTarget[mask][x]||0)+coeff;
    consumed.push([m.index,m.index+m[0].length]);
  }
  if(!consumed.length)return null;
  let rem=s;
  [...consumed].reverse().forEach(([a,b])=>{
    rem=rem.slice(0,a)+' '.repeat(b-a)+rem.slice(b);
  });
  rem=rem.replace(/\s+/g,'');
  if(rem){
    const tokens=rem.match(/[+\-]?\d+/g);
    if(tokens)constant=tokens.reduce((s,t)=>s+parseInt(t),0);
  }
  return{n:N,targetCoeffs:newTarget,targetK:constant};
}

function applyParsedTarget(result){
  if(!result)return false;
  if(result.n!==N){
    const hasActions=actions.some(a=>a.parsed);
    if(hasActions&&!confirm(`Target has N=${result.n} but current is N=${N}. Changing N will clear all actions. Continue?`))
      return false;
    initGame(result.n,null);updateTitle();
  }
  targetCoeffs=result.targetCoeffs;
  targetK=result.targetK;
  targetActive=true;targetEditMode=false;
  return true;
}

function handleTargetPaste(raw){
  const inp=document.getElementById('target-paste-input');
  const statusEl=document.getElementById('target-paste-status');
  if(!inp||!statusEl)return;
  if(!raw.trim()){
    inp.classList.remove('parse-ok','parse-err');
    statusEl.textContent='';
    return;
  }
  const result=parseInputAsTarget(raw);
  if(!result){
    inp.classList.remove('parse-ok');inp.classList.add('parse-err');
    statusEl.textContent='⚠ Unrecognised';
    statusEl.style.color='#c0392b';
  } else {
    inp.classList.remove('parse-err');inp.classList.add('parse-ok');
    const ok=applyParsedTarget(result);
    if(ok){
      // applyParsedTarget sets targetEditMode=false; rebuild right-bar and show expr-bar
      renderRightBar();renderExprBar();renderHasse();updateCongrats();
      renderChoiceLatex();
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  BM CORE
// ═══════════════════════════════════════════════════════════
function recomputeAll(){
  coeffs={};touched={};
  for(const action of actions){
    if(!action.parsed)continue;
    const{x,S,T}=action.parsed;
    for(let mask=1;mask<(1<<N);mask++){
      if(!(mask&(1<<x)))continue;
      if((mask&S)!==S)continue;
      if((mask&T)!==mask)continue;
      const diff=mask&~S;
      const delta=popcount(diff)%2===0?1:-1;
      if(!coeffs[mask])coeffs[mask]={};
      coeffs[mask][x]=(coeffs[mask][x]||0)+delta;
      if(!touched[mask])touched[mask]=new Set();
      touched[mask].add(x);
    }
  }
}
function doUndoAction(idx){actions.splice(idx,1);recomputeAll();renderAll();}

// ═══════════════════════════════════════════════════════════
//  PARSE ACTION TEXT
// ═══════════════════════════════════════════════════════════
function lettersToMask(str){
  let mask=0;
  for(const ch of(str||'').toLowerCase()){
    const idx=alts.indexOf(ch);if(idx<0)return -1;mask|=(1<<idx);
  }
  return mask;
}
function parseActionText(text){
  text=text.trim().replace(/→/g,'->').replace(/\s+/g,' ');
  const m=text.match(/^([a-zA-Z])\s*:\s*\{?([a-zA-Z]*)\}?\s*->\s*\{?([a-zA-Z]*)\}?\s*$/);
  if(!m)return null;
  const x=alts.indexOf(m[1].toLowerCase());if(x<0)return null;
  const S=lettersToMask(m[2]),T=lettersToMask(m[3]);
  if(S<0||T<0||S<1||S>=(1<<N)||T<1||T>=(1<<N))return null;
  if(!(S&(1<<x))||(T&S)!==S)return null;
  return{x,S,T};
}
function actionToText(x,S,T){return`${alts[x]}: {${maskToStr(S)}} → {${maskToStr(T)}}`;}

// ═══════════════════════════════════════════════════════════
//  SAVE / LOAD CODE
// ═══════════════════════════════════════════════════════════
function generateCode(){
  const parts=[`${N}`];
  for(const action of actions){
    if(!action.parsed)continue;
    const{x,S,T}=action.parsed;
    parts.push(`${alts[x]}:${S.toString(16)}-${T.toString(16)}`);
  }
  return parts.join('|');
}
function parseSaveCode(raw){
  raw=raw.trim();
  const parts=raw.split('|');
  const n=parseInt(parts[0],10);
  if(isNaN(n)||n<2||n>9)return null;
  const parsed=[];
  for(let i=1;i<parts.length;i++){
    const p=parts[i].trim();if(!p)continue;
    const m=p.match(/^([a-zA-Z]):([0-9a-fA-F]+)-([0-9a-fA-F]+)$/);
    if(!m)return null;
    const x='abcdefghi'.indexOf(m[1].toLowerCase());
    const S=parseInt(m[2],16),T=parseInt(m[3],16);
    if(x<0||x>=n||S<1||S>=(1<<n)||T<1||T>=(1<<n))return null;
    if(!(S&(1<<x))||(T&S)!==S)return null;
    parsed.push({x,S,T});
  }
  return{n,actions:parsed};
}

// ═══════════════════════════════════════════════════════════
//  INIT / N CHANGE
// ═══════════════════════════════════════════════════════════
function initGame(n,loadedActions){
  N=n;alts='abcdefghi'.slice(0,N).split('');
  coeffs={};touched={};actions=[];
  selLetter=null;selSource=null;
  if(loadedActions){
    for(const a of loadedActions)
      actions.push({raw:actionToText(a.x,a.S,a.T),parsed:a});
    recomputeAll();
  }
}
function updateTitle(){
  document.getElementById('diagram-title').textContent=`alternatives: { ${alts.join(', ')} }`;
  document.getElementById('n-selector').value=String(N);
}
function handleNChange(val){
  const n=parseInt(val);if(n===N)return;
  if(actions.some(a=>a.parsed))
    if(!confirm(`Changing N to ${n} will clear all current actions. Continue?`)){
      document.getElementById('n-selector').value=String(N);return;
    }
  targetCoeffs={};targetK=0;targetActive=false;targetEditMode=false;
  initGame(n,null);updateTitle();
  renderRightBar();renderTargetEditBar();renderAll();
}

// ═══════════════════════════════════════════════════════════
//  INTERACTION
// ═══════════════════════════════════════════════════════════
function handleLetterClick(mask,li,ctrlHeld,shiftHeld){
  if(shiftHeld){
    // Remove the most recent Ctrl+click action for this (letter, source set) → full set
    const fullSet=(1<<N)-1;
    for(let i=actions.length-1;i>=0;i--){
      const a=actions[i];
      if(a.parsed&&a.parsed.x===li&&a.parsed.S===mask&&a.parsed.T===fullSet){
        actions.splice(i,1);recomputeAll();renderAll();return;
      }
    }
    return;
  }
  if(ctrlHeld){
    const T=(1<<N)-1;selLetter=null;selSource=null;
    actions.push({raw:actionToText(li,mask,T),parsed:{x:li,S:mask,T}});
    recomputeAll();renderAll();return;
  }
  if(selLetter!==null&&selSource!==null){
    if(isValidTarget(mask)){finishSelection(mask);return;}
    if(selLetter===li&&selSource===mask){cancelSelection();return;}
  }
  selLetter=li;selSource=mask;renderAll();
}
function handleTargetBoxClick(mask){if(!isValidTarget(mask))return;finishSelection(mask);}
function finishSelection(targetMask){
  const x=selLetter,S=selSource,T=targetMask;
  selLetter=null;selSource=null;
  actions.push({raw:actionToText(x,S,T),parsed:{x,S,T}});
  recomputeAll();renderAll();
}
function cancelSelection(){selLetter=null;selSource=null;renderAll();}

function applyHoverPreview(T){
  if(selLetter===null||selSource===null)return;
  const x=selLetter,S=selSource;
  for(let mask=1;mask<(1<<N);mask++){
    if(!(mask&(1<<x)))continue;
    if((mask&S)!==S)continue;
    if((mask&T)!==mask)continue;
    const diff=popcount(mask&~S),delta=diff%2===0?1:-1;
    const el=document.getElementById(`cc-${mask}-${x}`);if(!el)continue;
    const rawNew=getCoeff(mask,x)+delta;
    const factor=factorForSet(mask,'current',dispMode);
    const newVal=rawNew-factor;
    el.textContent=String(newVal);
    el.className='coeff-cell coeff-preview';
    if(newVal>0)el.classList.add('coeff-pos');
    else if(newVal<0)el.classList.add('coeff-neg');
    else el.classList.add('coeff-zero');
  }
}
function clearHoverPreview(){
  document.querySelectorAll('.coeff-cell.coeff-preview').forEach(el=>{
    const parts=el.id.split('-');const mask=+parts[1],li=+parts[2];
    const val=dispCoeff(mask,li);
    el.className='coeff-cell';
    if(isTouched(mask,li)||val!==0){
      el.textContent=String(val);
      if(val>0)el.classList.add('coeff-pos');
      else if(val<0)el.classList.add('coeff-neg');
      else el.classList.add('coeff-zero');
    }else{el.textContent='';}
  });
}

// ═══════════════════════════════════════════════════════════
//  LaTeX / CONFIG GENERATION
// ═══════════════════════════════════════════════════════════
function generateLatex(){
  const counts=new Map();
  for(const action of actions){
    if(!action.parsed)continue;
    const{x,S,T}=action.parsed;
    const key=`${x}|${S}|${T}`;
    counts.set(key,(counts.get(key)||0)+1);
  }
  if(counts.size===0)return'';
  const entries=[...counts.entries()].map(([key,count])=>{
    const[x,S,T]=key.split('|').map(Number);return{x,S,T,count};
  });
  if(bmSortMode==='coeff'){
    entries.sort((a,b)=>{
      if(b.count!==a.count)return b.count-a.count;
      if(a.x!==b.x)return a.x-b.x;
      const sa=maskToStr(a.S),sb=maskToStr(b.S);if(sa!==sb)return sa<sb?-1:1;
      const ta=maskToStr(a.T),tb=maskToStr(b.T);return ta<tb?-1:ta>tb?1:0;
    });
  }else{
    entries.sort((a,b)=>{
      if(a.x!==b.x)return a.x-b.x;
      const sa=maskToStr(a.S),sb=maskToStr(b.S);if(sa!==sb)return sa<sb?-1:1;
      const ta=maskToStr(a.T),tb=maskToStr(b.T);return ta<tb?-1:ta>tb?1:0;
    });
  }
  return entries.map(({x,S,T,count})=>
    `${count>1?count:''}q_{${maskToStr(T)}}(${alts[x]},${maskToStr(S)})`
  ).join(' + ');
}

function generateChoiceLatex(){
  if(!actions.some(a=>a.parsed))return'';
  let constant=0;const pTerms=[];
  for(let mask=1;mask<(1<<N);mask++){
    const letters=maskLetterIndices(mask);if(!letters.length)continue;
    const factor=factorForSet(mask,'current',dispMode);
    constant+=factor;
    for(const li of letters){
      const residual=getCoeff(mask,li)-factor;
      if(residual!==0)pTerms.push({x:li,mask,coeff:residual});
    }
  }
  pTerms.sort((a,b)=>{
    if(a.x!==b.x)return a.x-b.x;
    const sa=maskToStr(a.mask),sb=maskToStr(b.mask);return sa<sb?-1:sa>sb?1:0;
  });
  if(!pTerms.length&&constant===0)return'0';
  const allParts=[
    ...pTerms.map(({x,mask,coeff})=>({val:coeff,str:`p(${alts[x]},${maskToStr(mask)})`})),
    ...(constant!==0?[{val:constant,str:''}]:[])
  ];
  if(!allParts.length)return'0';
  let result='';
  for(const{val,str}of allParts){
    const abs=Math.abs(val),pos=val>0;
    const coeffStr=(abs===1&&str)?'':String(abs);
    if(result==='')result=(pos?'':'-')+coeffStr+str;
    else result+=(pos?' + ':' - ')+coeffStr+str;
  }
  return result;
}

function generateChoiceConfig(){
  let k=0;const parts=[N,1,1,1];
  const entries=[];
  for(let mask=1;mask<(1<<N);mask++){
    const letters=maskLetterIndices(mask);if(!letters.length)continue;
    const factor=factorForSet(mask,'current',dispMode);
    k+=factor;
    for(const li of letters){
      const val=getCoeff(mask,li)-factor;
      if(val!==0)entries.push(`${mask}:${li}:${val}`);
    }
  }
  parts.push(k,...entries);
  return parts.join('|');
}

// ═══════════════════════════════════════════════════════════
//  TARGET EXPRESSION GENERATION
// ═══════════════════════════════════════════════════════════
function generateTargetChoiceLatex(){
  if(!targetActive)return'';

  for(let mask=1;mask<(1<<N);mask++){

    const factor=factorForSet(mask,'target',dispMode);
    constant+=factor;
    for(const li of letters){
      const residual=getTargetCoeff(mask,li)-factor;
      if(residual!==0)pTerms.push({x:li,mask,coeff:residual});
    }
  }
  pTerms.sort((a,b)=>{
    if(a.x!==b.x)return a.x-b.x;
    const sa=maskToStr(a.mask),sb=maskToStr(b.mask);return sa<sb?-1:sa>sb?1:0;
  });
  const allParts=[
    ...pTerms.map(({x,mask,coeff})=>({val:coeff,str:`p(${alts[x]},${maskToStr(mask)})`})),
    ...(constant!==0?[{val:constant,str:''}]:[])
  ];
  if(!allParts.length)return'0';
  let result='';
  for(const{val,str}of allParts){
    const abs=Math.abs(val),pos=val>0;
    const coeffStr=(abs===1&&str)?'':String(abs);
    if(result==='')result=(pos?'':'-')+coeffStr+str;
    else result+=(pos?' + ':' - ')+coeffStr+str;
  }
  return result;
}

function generateTargetConfig(){
  if(!targetActive)return'';
  let k=targetK;const parts=[N,1,1,1];const entries=[];
  for(let mask=1;mask<(1<<N);mask++){
    const letters=maskLetterIndices(mask);if(!letters.length)continue;
    const factor=factorForSet(mask,'target',dispMode);

    for(const li of letters){
      const val=getTargetCoeff(mask,li)-factor;
      if(val!==0)entries.push(`${mask}:${li}:${val}`);

// ═══════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════
function renderAll(){
  renderHasse();renderSidebar();renderChoiceLatex();renderBMLatex();updateCongrats();
  renderRightBar();renderExprBar();
  _updatingCode=true;
  document.getElementById('save-code').value=generateCode();
  _updatingCode=false;
  document.getElementById('save-code').classList.remove('parse-error');
  document.getElementById('save-code-status').textContent='';
}

function renderChoiceLatex(){
  const text=generateChoiceLatex();
  document.getElementById('choice-code').value=text;
  if(_choiceExpanded)document.getElementById('choice-code-expanded').value=text;
}

function renderBMLatex(){
  const text=generateLatex();
  document.getElementById('latex-code').value=text;
  if(_bmExpanded)document.getElementById('latex-code-expanded').value=text;
}

function toggleExpandChoice(){
  _choiceExpanded=!_choiceExpanded;
  document.getElementById('choice-expanded').style.display=_choiceExpanded?'':'none';
  const btn=document.getElementById('btn-expand-choice');
  btn.textContent=_choiceExpanded?'⤡':'⤢';
  if(_choiceExpanded)document.getElementById('choice-code-expanded').value=generateChoiceLatex();
}

function toggleExpandBM(){
  _bmExpanded=!_bmExpanded;
  document.getElementById('bm-expanded').style.display=_bmExpanded?'':'none';
  const btn=document.getElementById('btn-expand-bm');
  btn.textContent=_bmExpanded?'⤡':'⤢';
  if(_bmExpanded)document.getElementById('latex-code-expanded').value=generateLatex();
}

function renderHasse(){
  const hasse=document.getElementById('hasse');
  hasse.classList.toggle('selecting-mode',selLetter!==null);
  hasse.innerHTML='';

  const showConst=targetActive||dispMode>0;
  if(showConst){
    const curConst=currentConstant();
    const row=document.createElement('div');row.className='constant-row';
    const box=document.createElement('div');box.className='constant-box';

    const curEl=document.createElement('div');curEl.className='constant-current';
    curEl.textContent=String(curConst);
    const lblEl=document.createElement('div');lblEl.className='constant-label';
    lblEl.textContent='constant';
    box.appendChild(curEl);box.appendChild(lblEl);

    if(targetActive){
      if(targetEditMode){
        const kInput=document.createElement('input');
        kInput.type='number';kInput.className='constant-k-input';
        kInput.value=targetK;kInput.title='Target constant (k)';
        kInput.addEventListener('input',()=>{
          const v=parseInt(kInput.value);
          targetK=isNaN(v)?0:v;
          updateCongrats();
        });
        box.appendChild(kInput);
      } else {
        const tgtConst=targetConstant();
        if(curConst!==tgtConst)lblEl.classList.add('unmatched');
        const tgtEl=document.createElement('div');tgtEl.className='constant-target';
        tgtEl.textContent=String(tgtConst);
        box.appendChild(tgtEl);
      }
    }

    row.appendChild(box);hasse.appendChild(row);
  }

  for(const layer of layeredMasks()){
    const rowEl=document.createElement('div');rowEl.className='hasse-layer';
    for(const mask of layer)rowEl.appendChild(makeBoxEl(mask));
    hasse.appendChild(rowEl);
  }
}

function makeBoxEl(mask){
  const box=document.createElement('div');box.className='subset-box';
  const isSource=(selSource===mask),isTarget=isValidTarget(mask);
  if(isSource)box.classList.add('is-source');
  if(isTarget){
    box.classList.add('is-target');
    box.addEventListener('click',()=>handleTargetBoxClick(mask));
    box.addEventListener('mouseenter',()=>applyHoverPreview(mask));
    box.addEventListener('mouseleave',clearHoverPreview);
  }

  const cols=document.createElement('div');cols.className='letter-cols';
  // Use sorted order (alpha or coeff) for display within each box
  for(const li of sortedLetterIndicesForBox(mask)){
    const col=document.createElement('div');col.className='letter-col';

    const coeff=document.createElement('span');
    coeff.className='coeff-cell';coeff.id=`cc-${mask}-${li}`;
    const val=dispCoeff(mask,li);
    if(isTouched(mask,li)||val!==0){
      coeff.textContent=String(val);
      if(val>0)coeff.classList.add('coeff-pos');
      else if(val<0)coeff.classList.add('coeff-neg');
      else coeff.classList.add('coeff-zero');
    }

    const letter=document.createElement('span');letter.className='letter-cell';
    letter.textContent=alts[li];
    if(selLetter===li&&selSource===mask)letter.classList.add('is-active');
    // Matched = normal black (no class); unmatched when target active = red
    if(targetActive){
      if(!isMatched(mask,li))letter.classList.add('unmatched');
    }
    letter.addEventListener('click',e=>{
      e.stopPropagation();handleLetterClick(mask,li,e.ctrlKey||e.metaKey,e.shiftKey);
    });

    col.appendChild(coeff);col.appendChild(letter);

    if(targetActive||targetEditMode){
      if(targetEditMode){
        const inp=document.createElement('input');
        inp.type='number';inp.className='target-input-cell';
        const tv=getTargetCoeff(mask,li);
        inp.value=tv!==0?tv:'';inp.placeholder='0';
        inp.addEventListener('input',()=>{
          const v=parseInt(inp.value);
          setTargetCoeff(mask,li,isNaN(v)?0:v);
          // Refresh unmatched state immediately
          if(targetActive){
            letter.classList.toggle('unmatched',!isMatched(mask,li));
          }
          updateCongrats();
        });
        col.appendChild(inp);
      }else{
        const tv=dispTargetCoeff(mask,li);
        const tCell=document.createElement('div');tCell.className='target-cell';
        if(tv!==0){tCell.textContent=String(tv);tCell.classList.add('has-target');}
        col.appendChild(tCell);
      }
    }

    cols.appendChild(col);
  }
  box.appendChild(cols);
  return box;
}

function renderSidebar(){renderHint();renderActionsList();renderBottomHint();}

function renderHint(){
  const hintBox=document.getElementById('selection-hint');
  if(selLetter!==null){
    hintBox.style.display='';
    hintBox.innerHTML=
      `<strong>${alts[selLetter]}</strong> selected in {${maskToStr(selSource)}}<br>`+
      `Click any <span style="color:#d07000;font-weight:bold;">highlighted</span> superset `+
      `to apply q<sub>T</sub>(${alts[selLetter]}, {${maskToStr(selSource)}}).`;
  }else{
    hintBox.style.display='none';
  }
}

function renderBottomHint(){
  const bar=document.getElementById('bottom-hint-bar');
  if(!bar)return;
  if(selLetter!==null){
    bar.classList.add('visible');
    bar.innerHTML=
      `<strong>${alts[selLetter]}</strong> selected in {${maskToStr(selSource)}} — `+
      `click any <span style="color:#d07000;font-weight:bold;">highlighted</span> superset `+
      `to apply q<sub>T</sub>(${alts[selLetter]}, {${maskToStr(selSource)}}).`;
  }else{
    bar.classList.remove('visible');
  }
}

function renderActionsList(){
  const list=document.getElementById('actions-list');list.innerHTML='';
  if(actions.length===0){
    const msg=document.createElement('p');msg.className='no-actions-msg';
    msg.textContent='No actions yet.';list.appendChild(msg);
  }
  for(let idx=0;idx<actions.length;idx++){
    const{raw,parsed}=actions[idx];
    const hasError=!parsed&&raw.trim()!=='';
    const item=document.createElement('div');
    item.className='action-item'+(hasError?' has-error':'');item.dataset.idx=idx;
    const input=document.createElement('input');
    input.type='text';input.className='action-input';input.value=raw;
    input.addEventListener('input',()=>handleActionEdit(idx,input.value));
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();focusNewActionInput();}});
    const errIcon=document.createElement('span');
    errIcon.className='action-error-icon';errIcon.textContent='⚠';errIcon.title='Invalid — not applied';
    const removeBtn=document.createElement('button');
    removeBtn.className='btn-danger';removeBtn.textContent='×';
    removeBtn.title='Remove';removeBtn.addEventListener('click',()=>doUndoAction(idx));
    item.appendChild(input);item.appendChild(errIcon);item.appendChild(removeBtn);
    list.appendChild(item);
  }
  const newWrap=document.createElement('div');newWrap.className='new-action-row';
  const newInput=document.createElement('input');
  newInput.type='text';newInput.id='new-action-input';
  newInput.className='new-action-input';newInput.placeholder='e.g.  a: {a} → {abc}';
  newInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleNewActionSubmit(newInput);}});
  newInput.addEventListener('blur',()=>{if(newInput.value.trim())handleNewActionSubmit(newInput);});
  newWrap.appendChild(newInput);list.appendChild(newWrap);
}

function handleActionEdit(idx,newRaw){
  actions[idx].raw=newRaw;actions[idx].parsed=parseActionText(newRaw);
  const item=document.querySelector(`.action-item[data-idx="${idx}"]`);
  if(item)item.classList.toggle('has-error',!actions[idx].parsed&&newRaw.trim()!=='');
  recomputeAll();renderHasse();renderChoiceLatex();renderBMLatex();updateCongrats();
  _updatingCode=true;document.getElementById('save-code').value=generateCode();_updatingCode=false;
}
function handleNewActionSubmit(inputEl){
  const raw=inputEl.value.trim();if(!raw)return;
  actions.push({raw,parsed:parseActionText(raw)});
  recomputeAll();renderAll();
  const ni=document.getElementById('new-action-input');if(ni)ni.focus();
}
function focusNewActionInput(){
  const ni=document.getElementById('new-action-input');if(ni)ni.focus();
}

function handleSaveCodeInput(){
  if(_updatingCode)return;
  const raw=document.getElementById('save-code').value;
  const statusEl=document.getElementById('save-code-status');
  const ta=document.getElementById('save-code');
  if(!raw.trim()){ta.classList.remove('parse-error');statusEl.textContent='';return;}
  const parsed=parseSaveCode(raw.trim());
  if(!parsed){ta.classList.add('parse-error');statusEl.textContent='⚠ Invalid save code';}
  else{
    ta.classList.remove('parse-error');
    statusEl.textContent=`✓ Loaded N=${parsed.n}, ${parsed.actions.length} action(s)`;
    statusEl.style.color='#2a8a5a';
    initGame(parsed.n,parsed.actions);updateTitle();
    renderHasse();renderSidebar();renderChoiceLatex();renderBMLatex();updateCongrats();
    _updatingCode=true;ta.value=generateCode();_updatingCode=false;
  }
}

// ═══════════════════════════════════════════════════════════
//  COPY HELPERS
// ═══════════════════════════════════════════════════════════
function copyPanel(taId,btnId,origLabel,doneLabel){
  const text=document.getElementById(taId).value;
  const btn=document.getElementById(btnId);
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.getElementById(taId);ta.select();ta.setSelectionRange(0,99999);
    document.execCommand('copy');
  });
  btn.textContent=doneLabel;btn.classList.add('copied');
  setTimeout(()=>{btn.textContent=origLabel;btn.classList.remove('copied');},1800);
}

function copyChoiceConfig(){
  const text=generateChoiceConfig();
  const btn=document.getElementById('btn-copy-config');
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
  });
  btn.textContent='✓';btn.classList.add('copied');
  setTimeout(()=>{btn.textContent='Config';btn.classList.remove('copied');},1800);
}

// ═══════════════════════════════════════════════════════════
//  KEYBOARD + INIT
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelSelection();});
document.getElementById('save-code').addEventListener('input',handleSaveCodeInput);

initGame(4,null);
updateTitle();
setDispMode(1);
setBMSort('alpha');
renderRightBar();
renderAll();
</script>
